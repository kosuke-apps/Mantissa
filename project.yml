name: Mantissa
options:
  bundleIdPrefix: dev.kosuke
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "8"
packages:
  Mantissa:
    path: .
targets:
  Mantissa:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: Mantissa
        product: MantissaCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mantissa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 Kosuke Satake. MIT License.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleLocalizations:
          - en
          - ja
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kosuke.mantissa
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
  MantissaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: Mantissa
      - package: Mantissa
        product: MantissaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kosuke.mantissa.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Mantissa:
    build:
      targets:
        Mantissa: all
    test:
      targets:
        - MantissaTests
